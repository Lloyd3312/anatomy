apiVersion: apps/v1
kind: Deployment
metadata:
  name: anatomy-app
  labels:
    app: anatomy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anatomy
  template:
    metadata:
      labels:
        app: anatomy
    spec:
      containers:
      - name: anatomy-container
        image: nwachukwuchukwuka123/anatomy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
